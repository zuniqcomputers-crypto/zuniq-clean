<!DOCTYPE html>
<html>
<head><title>Worker Test</title></head>
<body>
  <h2>Zuniq Worker Test</h2>
  <button id="testBtn">Test Worker</button>
  <pre id="result"></pre>
  <script>
    const WORKER_URL = 'https://zuniq-proxy.zuniq-studio.workers.dev';
    document.getElementById('testBtn').addEventListener('click', async () => {
      const resultEl = document.getElementById('result');
      resultEl.textContent = 'Testing...';
      try {
        const resp = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==',
            mask: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
          })
        });
        const data = await resp.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = 'Fetch error: ' + err.message;
      }
    });
  </script>
</body>
</html>
