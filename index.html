<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zuniq Clean – AI Object Remover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { font-size: 0.85rem; color: #b0b0b0; margin-bottom: 16px; }
    .upload-area {
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .upload-area input[type="file"] { display: none; }
    .btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 10px 16px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn.primary { background: #a855f7; border-color: #a855f7; }
    .btn:disabled { opacity: 0.5; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .brush-size { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 50px; }
    .brush-size input[type="range"] { width: 80px; accent-color: #a855f7; }
    .canvas-container { position: relative; width: 100%; border-radius: 16px; overflow: hidden; margin-top: 12px; touch-action: none; background: #1c1c1c; }
    canvas { display: block; width: 100%; height: auto; }
    #maskCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
    .slider-container { margin-top: 12px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border-radius: 50px; padding: 6px 12px; }
    .slider-container input[type="range"] { flex: 1; accent-color: #a855f7; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    #statusMsg { font-size: 0.8rem; color: #b0b0b0; margin-top: 6px; text-align: center; }
    .token-area {
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.85rem;
    }
    .token-area input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 10px;
      border-radius: 12px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>✨ Zuniq Clean</h1>
    <p class="subtitle">Paint over anything. AI removes it perfectly.</p>

    <div class="token-area">
      <span style="opacity:0.8;">🔒 AI connected</span>
      <span style="flex:1; text-align:right; font-family:monospace; opacity:0.7; overflow:hidden; text-overflow:ellipsis;">zuniq-proxy.zuniq-studio.workers.dev</span>
    </div>

    <div id="uploadArea" class="upload-area">
      <label for="fileInput">📷 Choose a Photo</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="editor" class="hidden">
      <div class="canvas-container">
        <canvas id="originalCanvas"></canvas>
        <canvas id="maskCanvas"></canvas>
      </div>
      <div class="tools">
        <div class="brush-size">
          <span>🖌️</span>
          <input type="range" id="brushSize" min="5" max="80" value="25">
          <span id="brushValue">25</span>
        </div>
        <button id="undoBtn" class="btn" disabled>↩ Undo</button>
        <button id="redoBtn" class="btn" disabled>↪ Redo</button>
        <button id="clearMaskBtn" class="btn">🧽 Clear</button>
        <button id="zapBtn" class="btn primary">⚡ Zap It!</button>
      </div>
      <div class="slider-container">
        <span>Before</span>
        <input type="range" id="compareSlider" min="0" max="100" value="50">
        <span>After</span>
      </div>
      <button id="downloadBtn" class="btn">💾 Save HD</button>
      <div id="statusMsg"></div>
    </div>
  </div>

  <script>
    // ================== CONFIGURATION ==================
    const WORKER_URL = 'https://zuniq-proxy.zuniq-studio.workers.dev';

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const editor = document.getElementById('editor');
    const originalCanvas = document.getElementById('originalCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const brushSizeInput = document.getElementById('brushSize');
    const brushValue = document.getElementById('brushValue');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const clearMaskBtn = document.getElementById('clearMaskBtn');
    const zapBtn = document.getElementById('zapBtn');
    const compareSlider = document.getElementById('compareSlider');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');

    let img = null, imgWidth, imgHeight, originalImageData, editedImageData, maskCtx, brushSize=25, drawing=false;
    const MAX_HISTORY = 50;
    let maskHistory=[], historyIndex=-1;

    function getScaledPos(e) {
      const rect = maskCanvas.getBoundingClientRect();
      const scaleX = maskCanvas.width / rect.width;
      const scaleY = maskCanvas.height / rect.height;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    function drawBrush(x,y) {
      if(!maskCtx) return;
      maskCtx.fillStyle = 'rgba(255,0,0,0.7)';
      maskCtx.beginPath();
      maskCtx.arc(x,y,brushSize,0,Math.PI*2);
      maskCtx.fill();
    }

    function saveMaskState() {
      if(!maskCtx) return;
      if(historyIndex < maskHistory.length-1) maskHistory = maskHistory.slice(0, historyIndex+1);
      maskHistory.push(maskCtx.getImageData(0,0,imgWidth,imgHeight));
      if(maskHistory.length > MAX_HISTORY) maskHistory.shift();
      else historyIndex = maskHistory.length-1;
      updateUndoRedoButtons();
    }

    function undo() {
      if(historyIndex <= 0) return;
      historyIndex--;
      maskCtx.putImageData(maskHistory[historyIndex],0,0);
      updateUndoRedoButtons();
    }

    function redo() {
      if(historyIndex >= maskHistory.length-1) return;
      historyIndex++;
      maskCtx.putImageData(maskHistory[historyIndex],0,0);
      updateUndoRedoButtons();
    }

    function updateUndoRedoButtons() {
      undoBtn.disabled = (historyIndex <= 0);
      redoBtn.disabled = (historyIndex >= maskHistory.length-1);
    }

    function loadImage(file) {
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const image = new Image();
        image.onload = () => {
          img = image;
          const maxDim = 800;
          if(img.width > maxDim || img.height > maxDim) {
            const ratio = Math.min(maxDim/img.width, maxDim/img.height);
            imgWidth = Math.floor(img.width*ratio);
            imgHeight = Math.floor(img.height*ratio);
          } else {
            imgWidth = img.width;
            imgHeight = img.height;
          }
          originalCanvas.width = imgWidth;
          originalCanvas.height = imgHeight;
          maskCanvas.width = imgWidth;
          maskCanvas.height = imgHeight;
          maskCanvas.style.width = originalCanvas.style.width;
          maskCanvas.style.height = originalCanvas.style.height;

          const ctx = originalCanvas.getContext('2d');
          ctx.drawImage(img,0,0,imgWidth,imgHeight);
          originalImageData = ctx.getImageData(0,0,imgWidth,imgHeight);
          editedImageData = null;
          maskCtx = maskCanvas.getContext('2d');
          maskCtx.clearRect(0,0,imgWidth,imgHeight);
          maskHistory = [];
          const emptyMask = maskCtx.createImageData(imgWidth,imgHeight);
          for(let i=3; i<emptyMask.data.length; i+=4) emptyMask.data[i]=0;
          maskHistory.push(emptyMask);
          historyIndex=0;
          updateUndoRedoButtons();

          uploadArea.classList.add('hidden');
          editor.classList.remove('hidden');
          compareSlider.value=50;
          updateCompareView();
        };
        image.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', (e) => { if(e.target.files.length) loadImage(e.target.files[0]); });
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); if(e.dataTransfer.files.length) loadImage(e.dataTransfer.files[0]); });

    brushSizeInput.addEventListener('input', (e) => { brushSize=parseInt(e.target.value); brushValue.textContent=brushSize; });

    function startDraw(e) { if(!img) return; e.preventDefault(); drawing=true; const p=getScaledPos(e); drawBrush(p.x,p.y); }
    function moveDraw(e) { if(!drawing||!img) return; e.preventDefault(); const p=getScaledPos(e); drawBrush(p.x,p.y); }
    function endDraw() { if(drawing){ drawing=false; saveMaskState(); } }

    maskCanvas.addEventListener('mousedown', startDraw);
    maskCanvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    maskCanvas.addEventListener('touchstart', startDraw, {passive: false});
    maskCanvas.addEventListener('touchmove', moveDraw, {passive: false});
    maskCanvas.addEventListener('touchend', endDraw);
    maskCanvas.addEventListener('touchcancel', endDraw);

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);
    clearMaskBtn.addEventListener('click', ()=>{ if(maskCtx){ maskCtx.clearRect(0,0,imgWidth,imgHeight); saveMaskState(); } });

    function blendRemoval() {
      if (!img || !originalImageData || !maskCtx) return;
      const maskData = maskCtx.getImageData(0,0,imgWidth,imgHeight).data;
      const imgData = new ImageData(new Uint8ClampedArray(originalImageData.data), imgWidth, imgHeight);
      const data = imgData.data;
      const radius = Math.max(8, brushSize);
      const temp = new Uint8ClampedArray(data);

      for (let y = 0; y < imgHeight; y++) {
        for (let x = 0; x < imgWidth; x++) {
          const idx = (y * imgWidth + x) * 4;
          if (maskData[idx + 3] > 20) {
            let r = 0, g = 0, b = 0, count = 0;
            for (let dy = -radius; dy <= radius; dy += 2) {
              for (let dx = -radius; dx <= radius; dx += 2) {
                const sx = x + dx, sy = y + dy;
                if (sx >= 0 && sx < imgWidth && sy >= 0 && sy < imgHeight) {
                  const ni = (sy * imgWidth + sx) * 4;
                  if (maskData[ni + 3] <= 20) {
                    r += temp[ni]; g += temp[ni + 1]; b += temp[ni + 2];
                    count++;
                  }
                }
              }
            }
            if (count > 0) {
              data[idx] = r / count; data[idx + 1] = g / count; data[idx + 2] = b / count;
            }
          }
        }
      }
      const smooth = new Uint8ClampedArray(data);
      for (let y = 0; y < imgHeight; y++) {
        for (let x = 0; x < imgWidth; x++) {
          const idx = (y * imgWidth + x) * 4;
          if (maskData[idx + 3] > 20) {
            let r = 0, g = 0, b = 0, c = 0;
            for (let dy = -2; dy <= 2; dy++) {
              for (let dx = -2; dx <= 2; dx++) {
                const sx = x + dx, sy = y + dy;
                if (sx >= 0 && sx < imgWidth && sy >= 0 && sy < imgHeight) {
                  const ni = (sy * imgWidth + sx) * 4;
                  r += smooth[ni]; g += smooth[ni + 1]; b += smooth[ni + 2];
                  c++;
                }
              }
            }
            data[idx] = r / c; data[idx + 1] = g / c; data[idx + 2] = b / c;
          }
        }
      }

      editedImageData = new ImageData(new Uint8ClampedArray(data), imgWidth, imgHeight);
      originalCanvas.getContext('2d').putImageData(editedImageData, 0, 0);
      maskCtx.clearRect(0,0,imgWidth,imgHeight);
      saveMaskState();
      updateCompareView();
      statusMsg.textContent = '⚡ AI unavailable – used instant blend.';
    }

    async function aiRemoval() {
      if (!img || !maskCtx) return;
      const maskData = maskCtx.getImageData(0,0,imgWidth,imgHeight);
      let anyMasked = false;
      for (let i = 3; i < maskData.data.length; i += 4) {
        if (maskData.data[i] > 20) { anyMasked = true; break; }
      }
      if (!anyMasked) {
        statusMsg.textContent = '⚠️ Paint over the object first.';
        return;
      }

      statusMsg.innerHTML = '<span class="spinner"></span> AI removing… (10–30s)';
      zapBtn.disabled = true;

      const bwCanvas = document.createElement('canvas');
      bwCanvas.width = imgWidth;
      bwCanvas.height = imgHeight;
      const bwCtx = bwCanvas.getContext('2d');
      const bwImageData = bwCtx.createImageData(imgWidth, imgHeight);
      const m = maskData.data;
      for (let i = 0; i < bwImageData.data.length; i += 4) {
        if (m[i + 3] > 20 && m[i] > 20) {
          bwImageData.data[i] = 255; bwImageData.data[i + 1] = 255;
          bwImageData.data[i + 2] = 255; bwImageData.data[i + 3] = 255;
        } else {
          bwImageData.data[i] = 0; bwImageData.data[i + 1] = 0;
          bwImageData.data[i + 2] = 0; bwImageData.data[i + 3] = 255;
        }
      }
      bwCtx.putImageData(bwImageData, 0, 0);

      const imageBase64 = originalCanvas.toDataURL('image/jpeg', 0.8);
      const maskBase64 = bwCanvas.toDataURL('image/png');

      try {
        const resp = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageBase64, mask: maskBase64 })
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        const resultImg = new Image();
        resultImg.onload = () => {
          const ctx = originalCanvas.getContext('2d');
          ctx.clearRect(0,0,imgWidth,imgHeight);
          ctx.drawImage(resultImg,0,0,imgWidth,imgHeight);
          editedImageData = ctx.getImageData(0,0,imgWidth,imgHeight);
          maskCtx.clearRect(0,0,imgWidth,imgHeight);
          saveMaskState();
          updateCompareView();
          statusMsg.textContent = '✅ AI removal perfect!';
          zapBtn.disabled = false;
        };
        resultImg.onerror = () => { throw new Error('Could not load result image.'); };
        resultImg.src = data.result;
      } catch (err) {
        console.error(err);
        statusMsg.textContent = '❌ AI error: ' + err.message + ' — falling back to blend.';
        blendRemoval();
        zapBtn.disabled = false;
      }
    }

    zapBtn.addEventListener('click', aiRemoval);

    function updateCompareView() {
      const val = parseInt(compareSlider.value)/100;
      const ctx = originalCanvas.getContext('2d');
      if(editedImageData && originalImageData) {
        ctx.clearRect(0,0,imgWidth,imgHeight);
        ctx.putImageData(editedImageData,0,0);
        const splitX = Math.floor(imgWidth * val);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0,0,splitX,imgHeight);
        ctx.clip();
        ctx.putImageData(originalImageData,0,0);
        ctx.restore();
      } else if(originalImageData) {
        ctx.putImageData(originalImageData,0,0);
      }
    }
    compareSlider.addEventListener('input', updateCompareView);

    downloadBtn.addEventListener('click', ()=>{
      const link = document.createElement('a');
      link.download = 'zuniq-clean.jpg';
      link.href = originalCanvas.toDataURL('image/jpeg',0.95);
      link.click();
    });
  </script>
</body>
</html>
